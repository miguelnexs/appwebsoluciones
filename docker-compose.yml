services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=localix
    ports:
      - "5432:5432"
    restart: always

  backend:
    build: ./Localix-backend
    volumes:
      - ./Localix-backend:/app
      - ./media:/app/media
      - ./static:/app/static
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/localix
      - DEBUG=True
      - SECRET_KEY=localix_development_secret_key
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    depends_on:
      - db
    restart: always

  frontend:
    build: ./Localix-dashboard
    volumes:
      - ./Localix-dashboard:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8000
      - NODE_ENV=development
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: